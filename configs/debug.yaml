model:
  vocab_size: 256
  max_seq_len: 64
  n_layer: 2
  n_head: 2
  n_embd: 64
  mlp_ratio: 4
  dropout: 0.0
  bias: true

training:
  batch_size: 2
  grad_accum_steps: 1
  learning_rate: 0.001
  min_learning_rate: 0.0001
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 10

data:
  seq_len: 64
