model:
  vocab_size: 8192
  max_seq_len: 256
  n_layer: 8
  n_head: 8
  n_embd: 512
  mlp_ratio: 4
  dropout: 0.0
  bias: true

training:
  batch_size: 16
  grad_accum_steps: 8
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 500

data:
  seq_len: 256
